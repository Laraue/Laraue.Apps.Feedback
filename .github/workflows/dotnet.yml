# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - "5432:5432"
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run all tests
      run: dotnet test -c Release --no-build

    - name: Pack Internal API Host
      if: github.ref == 'refs/heads/main'
      run: tar -czf internal-api-host.tar.gz -C src/Laraue.Apps.Feedback.InternalApiHost/bin/Release/net10.0 .

    - name: Upload Internal API Host artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: internal-api-host
        path: internal-api-host.tar.gz
        retention-days: 7

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Feedback Internal API Host
            artifact: internal-api-host
            archive: internal-api-host.tar.gz
            remote_dir: /home/laraue/feedback-internal-api-host
            image: feedback-internal-api-host
            environment: internalapi-production
    environment: ${{ matrix.environment }}
    steps:
    - name: Notify deploy started
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="🚀 Deploy started: ${{ matrix.name }} (${{ github.sha }})"

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.artifact }}

    - name: Upload host
      uses: marcodallasanta/ssh-scp-deploy@v1.2.0
      with:
       host: ${{ secrets.SSH_HOST }} # "example.com"
       port: ${{ secrets.SSH_PORT }} # 22
       user: ${{ secrets.SSH_USER }} # "user"
       password: ${{ secrets.SSH_PASSWORD }} # "password"
       local: ${{ matrix.archive }}
       remote: ${{ matrix.remote_dir }}
       post_upload: |-
        cd ${{ matrix.remote_dir }} && find . -mindepth 1 ! -name ${{ matrix.archive }} -delete &&
        tar -xzf ${{ matrix.archive }} && rm ${{ matrix.archive }}

    - name: Build container
      uses: appleboy/ssh-action@v1
      with:
       host: ${{ secrets.SSH_HOST }}
       port: ${{ secrets.SSH_PORT }}
       username: ${{ secrets.SSH_USER }}
       password: ${{ secrets.SSH_PASSWORD }}
       script: |
        set -e
        cd /home/laraue && docker compose build ${{ matrix.image }}
        docker compose up -d --force-recreate ${{ matrix.image }}

    - name: Notify deploy finished
      if: success()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="✅ Deploy finished: ${{ matrix.name }} (${{ github.sha }})"

    - name: Notify deploy failed
      if: failure()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="❌ Deploy failed: ${{ matrix.name }} (${{ github.sha }})"
